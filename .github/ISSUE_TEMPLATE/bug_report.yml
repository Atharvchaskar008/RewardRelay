name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the deal id and the `requestId` from the error, if any. Never paste keys, PINs, OTPs or personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app (UI), API, Smart contracts, SDK, Docs, Other]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Browser / OS / network (MST Testnet or local)
